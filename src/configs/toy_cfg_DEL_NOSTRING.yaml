model:
  hidden_channels: 256
  batch_size: 2
  edge_attrs: false
  edge_types:
  - - aa
    - close_to
    - aa
  - - aa
    - belongs_to
    - protein
  - - protein
    - aligned_with
    - protein
  interpro: true
  go_neighbors: true
  mean_aa_pool: false
  sampled_edges:
    protein__aligned_with__protein: -1
trainer:
  epochs: 2
  device: cuda
  compile: false
  num_workers: 4
optimizer:
  type: Adam
  lr: 0.001
scheduler:
  type: StepLR
  step_size: 1
  gamma: 0.5
data:
  subontology: MFO
  dataset: toy
  train_proteins: toy
  swissprot_release: '2024_01'
  exp_only: true
  external_annotations_path: ./data/swissprot/2024_01/swissprot_2024_01_MFO_exp_annotations.tsv
  alignment_path: ./data/toy/toy_swissprot_2024_01_alignment.tsv
  protein_graphs: ./data/toy/protein_graphs
  stringdb_path: ./data/toy/toy_stringdb.tsv
run:
  qualifier: 2024_01_toy_del_nostring
  save_predictions:
    val: true
    test: true
  test_only: false
  save_epoch_checkpoints: true
  run_beprof_eval: true
  run_cafa_eval: true
  save_model: true
