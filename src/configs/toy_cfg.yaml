model:
  hidden_channels: 256
  batch_size: 2
  edge_attrs: false
  edge_types:
    # - ["aa", "close_to", "aa"]
    - ["aa", "belongs_to", "protein"]
    - ["protein", "aligned_with", "protein"]
    # - ["protein", "stringdb", "protein"]
  interpro: true # Intepro domain annotations as additional input features
  go_neighbors: true # Whether to include direct GO term negihbors as additional input features

  # How many edges to sample to build mini-batch subgraphs. Follows PyG nomenclature
  sampled_edges:
    protein__aligned_with__protein: -1
    # protein__stringdb__protein: 30

trainer:
  epochs: 2
  device: cuda
  compile: false  # Whether to use torch.compile
  num_workers: 4

optimizer:
  type: Adam
  lr: 0.001

scheduler:
  type: StepLR
  step_size: 1
  gamma: 0.5

data:
  dataset: 'toy'
  subontology: 'MFO'  # One or more from ['CCO', 'MFO', 'BPO']
  train_proteins: 'toy'  # Override 'dataset' train proteins with the specified dataset's proteins.
  exp_only: true  # If training on SwissProt, whether to use only experimental annotations
  swissprot_release: '2024_01'  # SwissProt release annotations used when training on SwissProt proteins (train_proteins: swissprot)
  external_annotations_path: ./data/swissprot/2024_01/swissprot_2024_01_MFO_exp_annotations.tsv # Override train annotations with a specific annotation file. Also overrides 'exp_only' flag.

  alignment_path: ./data/toy/toy_swissprot_2024_01_alignment.tsv
  protein_graphs: ./data/toy/protein_graphs
  stringdb_path: ./data/toy/toy_stringdb.tsv


run:
  qualifier: toy  # Additional string to append to run_id for uniqueness
  save_predictions:
    val: true
    test: true
  test_only: false  # Whether to run evaluation only on the test set (no validation)
  save_model: true
  run_beprof_eval: true
  run_cafa_eval: true