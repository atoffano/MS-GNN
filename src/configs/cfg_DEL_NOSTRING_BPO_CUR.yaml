model:
  hidden_channels: 256
  batch_size: 8
  edge_attrs: true
  edge_types:
  - - aa
    - close_to
    - aa
  - - aa
    - belongs_to
    - protein
  - - protein
    - aligned_with
    - protein
  interpro: true
  go_neighbors: true
  mean_aa_pool: false
  sampled_edges:
    protein__aligned_with__protein: -1
trainer:
  epochs: 6
  device: cuda
  compile: false
  num_workers: 4
optimizer:
  type: Adam
  lr: 0.001
scheduler:
  type: StepLR
  step_size: 1
  gamma: 0.5
data:
  subontology: BPO
  dataset: D1
  train_proteins: D1
  swissprot_release: '2024_01'
  exp_only: false
  external_annotations_path: ./data/swissprot/2024_01/swissprot_2024_01_BPO_annotations.tsv
  alignment_path: ./data/swissprot/2024_01/diamond_swissprot_2024_01_alignment.tsv
  protein_graphs: ./data/swissprot/2024_01/protein_graphs
  stringdb_path: ./data/swissprot/2024_01/swissprot_stringdb.tsv
run:
  qualifier: GNN_DEL_NOSTRING_CUR
  save_predictions:
    val: false
    test: true
  test_only: true
  save_epoch_checkpoints: true
  run_beprof_eval: true
  run_cafa_eval: true
